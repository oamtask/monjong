
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>สภาพอากาศ อบต.ม่อนจอง</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<style>
  body {
    background-color: #e6f0f8;
    color: #034e7b;
    font-family: "Sarabun", sans-serif;
    min-height: 100vh;
  }
  .card {
    background-color: #d9f0f7;
    border-radius: 1rem;
    box-shadow: 0 4px 8px rgba(3, 78, 123, 0.2);
    padding: 1rem;
    text-align: center;
  }
  h1, h2 {
    color: #0277bd;
  }
  .value {
    font-size: 1.8rem;
    font-weight: 700;
    margin-top: 0.3rem;
  }
  iframe {
    border-radius: 1rem;
    box-shadow: 0 4px 8px rgba(3, 78, 123, 0.15);
    margin-top: 1rem;
  }
  .label {
    font-size: 0.9rem;
    font-weight: 600;
    margin-top: 0.3rem;
    color: #014f86;
  }
</style>
</head>
<body>

<main class="max-w-xl mx-auto mt-8 p-4">
  <h1 class="text-3xl font-bold text-center mb-4">สภาพอากาศ - อบต.ม่อนจอง</h1>
  <p class="text-center mb-4" id="dateToday" style="font-size:1.1rem;">วันที่: --</p>

  <div class="grid grid-cols-2 gap-4 mb-4">
    <div class="card">
      🌡️
      <div class="label">อุณหภูมิ</div>
      <div id="temperature" class="value">-- °C</div>
    </div>
    <div class="card">
      💧
      <div class="label">ความชื้น</div>
      <div id="humidity" class="value">-- %</div>
    </div>
    <div class="card">
      🌧️
      <div class="label">ปริมาณน้ำฝน</div>
      <div id="rain" class="value">-- mm</div>
    </div>
    <div class="card">
      🌀
      <div class="label">ความกดอากาศ</div>
      <div id="pressure" class="value">-- hPa</div>
    </div>
  </div>

  <h2 class="text-xl font-semibold mb-2">แผนที่องค์การบริหารส่วนตำบลม่อนจอง</h2>
  <iframe
    width="100%"
    height="250"
    loading="lazy"
    allowfullscreen
    src="https://maps.google.com/maps?q=องค์การบริหารส่วนตำบลม่อนจอง,เชียงใหม่,ประเทศไทย&t=&z=15&ie=UTF8&iwloc=&output=embed"
  ></iframe>

  <h2 class="text-xl font-semibold mt-6 mb-2">กราฟข้อมูลสภาพอากาศ (เรียลไทม์)</h2>
  <canvas id="weatherChart" height="250"></canvas>
</main>

<script>
  const API_KEY = "403d8de1a530aa8e08fa20b0e67b97c6";
  const LAT = 17.3803260675773;
  const LON = 98.47738163491294;

  const history = {
    time: [],
    temperature: [],
    humidity: [],
    rain: [],
    pressure: [],
  };

  const ctx = document.getElementById("weatherChart").getContext("2d");
  const weatherChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: history.time,
      datasets: [
        {
          label: "อุณหภูมิ (°C)",
          data: history.temperature,
          borderColor: "#0288d1",
          backgroundColor: "rgba(2, 136, 209, 0.2)",
          fill: true,
          tension: 0.4,
          yAxisID: "yTemp",
        },
        {
          label: "ความชื้น (%)",
          data: history.humidity,
          borderColor: "#43a047",
          backgroundColor: "rgba(67, 160, 71, 0.2)",
          fill: true,
          tension: 0.4,
          yAxisID: "yHumidity",
        },
        {
          label: "ปริมาณน้ำฝน (mm)",
          data: history.rain,
          borderColor: "#0288d1",
          backgroundColor: "rgba(2, 136, 209, 0.3)",
          fill: true,
          tension: 0.4,
          yAxisID: "yRain",
        },
        {
          label: "ความกดอากาศ (hPa)",
          data: history.pressure,
          borderColor: "#1565c0",
          backgroundColor: "rgba(21, 101, 192, 0.2)",
          fill: true,
          tension: 0.4,
          yAxisID: "yPressure",
        },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: "nearest", intersect: false },
      stacked: false,
      scales: {
        x: {
          title: { display: true, text: "เวลา (HH:MM:SS)" },
        },
        yTemp: {
          type: "linear",
          position: "left",
          title: { display: true, text: "อุณหภูมิ (°C)" },
          ticks: { beginAtZero: false },
          min: 0,
        },
        yHumidity: {
          type: "linear",
          position: "right",
          title: { display: true, text: "ความชื้น (%)" },
          grid: { drawOnChartArea: false },
          min: 0,
          max: 100,
        },
        yRain: {
          type: "linear",
          position: "right",
          offset: true,
          title: { display: true, text: "น้ำฝน (mm)" },
          grid: { drawOnChartArea: false },
          min: 0,
        },
        yPressure: {
          type: "linear",
          position: "left",
          offset: true,
          title: { display: true, text: "ความกดอากาศ (hPa)" },
          grid: { drawOnChartArea: false },
          min: 900,
          max: 1100,
        },
      },
    },
  });

  function updateDate() {
    const now = new Date();
    const options = { year: "numeric", month: "long", day: "numeric" };
    document.getElementById("dateToday").textContent =
      "วันที่: " + now.toLocaleDateString("th-TH", options);
  }

  async function fetchWeather() {
    try {
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&units=metric&lang=th&appid=${API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();

      const temp = data.main.temp;
      const humidity = data.main.humidity;
      const pressure = data.main.pressure;
      const rain = data.rain?.["1h"] || 0;

      const timeLabel = new Date().toLocaleTimeString();

      document.getElementById("temperature").textContent = `${temp.toFixed(1)} °C`;
      document.getElementById("humidity").textContent = `${humidity} %`;
      document.getElementById("rain").textContent = `${rain} mm`;
      document.getElementById("pressure").textContent = `${pressure} hPa`;

      if (history.time.length >= 20) {
        history.time.shift();
        history.temperature.shift();
        history.humidity.shift();
        history.rain.shift();
        history.pressure.shift();
      }

      history.time.push(timeLabel);
      history.temperature.push(temp);
      history.humidity.push(humidity);
      history.rain.push(rain);
      history.pressure.push(pressure);

      weatherChart.update();
    } catch (error) {
      console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", error);
    }
  }

  updateDate();
  fetchWeather();
  setInterval(fetchWeather, 60000);
</script>
</body>
</html>
