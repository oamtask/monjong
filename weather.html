<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สภาพอากาศ – อบต.ม่อนจอง</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #e6f2ff;
      color: #333;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 20px;
      margin: 20px auto;
      max-width: 480px;
    }
    h1, h2 {
      color: #003366;
    }
    .weather-item {
      margin: 6px 0;
      font-size: 1.1em;
    }
    .weather-icon {
      font-size: 1.4em;
    }
  </style>
</head>
<body>

  <h1>สภาพอากาศ – อบต.ม่อนจอง</h1>
  <p id="datetime">อัปเดตล่าสุด: ...</p>

  <div class="card">
    <h2>อบต.ม่อนจอง</h2>
    <div class="weather-item">🌡️ อุณหภูมิ: <span id="temp"></span> °C</div>
    <div class="weather-item">💧 ความชื้น: <span id="humidity"></span>%</div>
    <div class="weather-item">🌧️ ปริมาณฝน: <span id="rain"></span> mm</div>
    <div class="weather-item">📊 ความดัน: <span id="pressure"></span> hPa</div>
    <div class="weather-item">☁️ สภาพ: <span id="description"></span></div>
  </div>

  <script>
    const API_KEY = '403d8de1a530aa8e08fa20b0e67b97c6';
    const lat = 17.38035783463864;
    const lon = 98.47743439343176;

    async function fetchWeather() {
      const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=th`);
      const data = await res.json();

      document.getElementById('temp').textContent = data.main.temp.toFixed(1);
      document.getElementById('humidity').textContent = data.main.humidity;
      document.getElementById('pressure').textContent = data.main.pressure;
      document.getElementById('description').textContent = data.weather[0].description;

      // ฝน (บางครั้งไม่มีข้อมูล)
      const rain = data.rain && data.rain['1h'] ? data.rain['1h'] : 0;
      document.getElementById('rain').textContent = rain.toFixed(2);

      const now = new Date();
      const dateTimeStr = now.toLocaleString('th-TH', { 
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      document.getElementById('datetime').textContent = `อัปเดตล่าสุด: ${dateTimeStr}`;
    }

    fetchWeather();
    setInterval(fetchWeather, 60000); // รีเฟรชทุก 60 วินาที
  </script>
</body>
</html>
